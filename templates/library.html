<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
    <title>Bibliothèque BD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-library-search.css') }}?v={{ asset_version('css/style-library-search.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Navigation verticale -->
        <div class="sidebar-nav">
            <div class="sidebar-brand">
                <img src="{{ url_for('static', filename='img/bullarr-icon.png') }}" alt="" class="sidebar-brand-icon">
                <span class="sidebar-brand-name">Bull<span class="sidebar-brand-accent">arr</span></span>
            </div>
            <a href="/" class="nav-link">📚 Bibliothèque</a>
            <a href="/import" class="nav-link">📥 Activités</a>
            <a href="/discover" class="nav-link">🎯 Recherche</a>
            <a href="/ebdz-nouveautes" class="nav-link">🆕 Nouveautés</a>
            <a href="/bedetheque-enrich" class="nav-link">📖 Enrichir</a>
            <a href="/missing-monitor" class="nav-link">📊 Surveillance</a>
            <a href="/verification" class="nav-link">✅ Vérification</a>
            <a href="/history" class="nav-link">🕓 Historique</a>
            <a href="/settings" class="nav-link">⚙️ Configuration</a>
        </div>

        <div class="main-wrapper">
            <header>
                <div class="header-content">
                    <div class="header-left">
                        <div class="library-title-row">
                            <h1 id="library-title"><span class="header-title-icon"><svg class="icon header-title-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></svg></span> Bibliothèque</h1>
                            <div class="library-title-actions">
                                <p class="subtitle" id="library-path">Chargement...</p>
                                <button type="button" class="btn-secondary-link" onclick="renameCurrentLibrary()" title="Renommer cette bibliothèque" aria-label="Renommer cette bibliothèque"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></button>
                                <a href="/?all=1" class="btn-secondary-link" title="Nouvelle bibliothèque" aria-label="Nouvelle bibliothèque"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14" /><path d="M12 5v14" /></svg></a>
                            </div>
                        </div>
                        <!-- "ajoute un rename bibliothèque en mobile... et ajouter une nouvelle" -
                             .library-title-actions ci-dessus ne s'affiche qu'au survol (:hover),
                             inatteignable au toucher - masqué en entier sur mobile (voir
                             style-library-search.css). Boutons dédiés, toujours visibles (pas de
                             hover), affichés UNIQUEMENT en mobile pour ne pas dupliquer les actions
                             déjà accessibles au survol en desktop. -->
                        <div class="library-title-mobile-actions">
                            <button type="button" class="library-title-mobile-action" onclick="renameCurrentLibrary()">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
                                Renommer
                            </button>
                            <a href="/?all=1" class="library-title-mobile-action">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
                                Nouvelle bibliothèque
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="content library-content">
            <!-- « Continuer la lecture » (comme le « Keep reading » de Komga) : albums commencés,
                 avec le bouton de synchronisation de l'avancement Komga - voir
                 loadKeepReading/syncKomgaReading côté library.js. Masquée sans Komga. -->
            <section class="keep-reading" id="keep-reading-section" hidden></section>

            <!-- "pas dans le header mais au dessus des albums a coté des
                 library-swithcer et aligné à gauche" - stats à gauche (mêmes ids
                 series-count/volumes-count/total-size que l'ancienne .library-stats-row,
                 remplies par le même code JS updateStats dans library.js), view-switcher
                 à droite (justify-content:space-between sur .search-row), toute la ligne
                 collée au header au-dessus et à la grille en dessous (voir
                 .library-content/.search-row margin-bottom:0 dans
                 style-library-search.css). -->
            <div class="search-row">
                <div class="library-stats-row-compact">
                    <span class="library-stat-compact"><span id="series-count">-</span> séries</span>
                    <span class="library-stat-compact"><span id="volumes-count">-</span> volumes</span>
                    <span class="library-stat-compact"><span id="total-size">-</span></span>
                    <button class="toolbar-btn" id="library-reload-btn" onclick="reloadLibraryData(this)" title="Recharger la bibliothèque">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg></span>
                        <span class="toolbar-btn-label">Recharger</span>
                    </button>
                </div>
                <div id="active-filter-badges" class="active-filter-badges" style="display: none;"></div>
                <div class="search-row-view-switcher">
                <div class="toolbar-dropdown" id="series-sort-section">
                    <button class="toolbar-btn" id="series-sort-btn" onclick="toggleToolbarDropdown('sort-dropdown-menu', this)" title="Ordre d'affichage des séries">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 16-4 4-4-4" /><path d="M17 20V4" /><path d="m3 8 4-4 4 4" /><path d="M7 4v16" /></svg></span>
                        <span class="toolbar-btn-label" id="series-sort-label">Trier</span>
                    </button>
                    <div class="toolbar-dropdown-menu toolbar-dropdown-menu-right" id="sort-dropdown-menu" style="display: none;">
                        <button class="toolbar-dropdown-item" data-sort="alpha" onclick="setSeriesSortMode('alpha')">🔤 Alphabétique</button>
                        <button class="toolbar-dropdown-item" data-sort="votes" onclick="setSeriesSortMode('votes')">⭐ Popularité (votes)</button>
                        <button class="toolbar-dropdown-item" data-sort="added" onclick="setSeriesSortMode('added')">🕒 Date d'ajout</button>
                        <button class="toolbar-dropdown-item" data-sort="year" onclick="setSeriesSortMode('year')">📅 Année de parution</button>
                        <button class="toolbar-dropdown-item" data-sort="size" onclick="setSeriesSortMode('size')">💾 Taille</button>
                        <button class="toolbar-dropdown-item" data-sort="volumes" onclick="setSeriesSortMode('volumes')">📚 Nombre de tomes</button>
                    </div>
                </div>
                <div class="toolbar-dropdown" id="status-filter-section">
                    <button class="toolbar-btn" id="status-filter-btn" onclick="toggleToolbarDropdown('status-filter-menu', this)" title="Filtrer par statut de la collection">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z" /><path d="M21.21 15.89A10 10 0 1 1 8 2.83" /></svg></span>
                        <span class="toolbar-btn-label">Statut</span>
                    </button>
                    <div class="toolbar-dropdown-menu toolbar-dropdown-menu-right" id="status-filter-menu" style="display: none;"></div>
                </div>
                <div class="toolbar-dropdown" id="origin-filter-section">
                    <button class="toolbar-btn" id="origin-filter-btn" onclick="toggleToolbarDropdown('origin-filter-menu', this)" title="Filtrer par origine : BD, Comics, Manga (Bédéthèque)">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></svg></span>
                        <span class="toolbar-btn-label">Origine</span>
                    </button>
                    <div class="toolbar-dropdown-menu toolbar-dropdown-menu-right" id="origin-filter-menu" style="display: none;"></div>
                </div>
                <div class="toolbar-dropdown" id="lists-filter-section">
                    <button class="toolbar-btn" id="lists-filter-btn" onclick="toggleToolbarDropdown('lists-filter-menu', this)" title="Listes personnelles : à lire plus tard et favoris">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></svg></span>
                        <span class="toolbar-btn-label">Listes</span>
                    </button>
                    <div class="toolbar-dropdown-menu toolbar-dropdown-menu-right" id="lists-filter-menu" style="display: none;">
                        <button class="toolbar-dropdown-item" data-filter="to-read" onclick="toggleSeriesFilter(this.dataset.filter)"><span class="filter-item-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></svg></span>À lire plus tard</button>
                        <button class="toolbar-dropdown-item" data-filter="favorite" onclick="toggleSeriesFilter(this.dataset.filter)"><span class="filter-item-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg></span>Favoris</button>
                    </div>
                </div>
                <button type="button" class="toolbar-btn select-mode-btn" id="series-select-mode-btn" onclick="toggleSeriesSelectMode()" aria-pressed="false" title="Sélectionner des séries pour agir sur plusieurs à la fois">
                    <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="m9 12 2 2 4-4" /></svg></span>
                    <span class="toolbar-btn-label">Sélectionner</span>
                </button>
                <div class="view-switcher">
                    <button class="view-switch-btn" data-view="poster" onclick="setSeriesViewMode('poster')" title="Vue affiches"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></svg> Affiches</button>
                    <button class="view-switch-btn" data-view="overview" onclick="setSeriesViewMode('overview')" title="Vue aperçu"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h.01" /><path d="M3 12h.01" /><path d="M3 19h.01" /><path d="M8 5h13" /><path d="M8 12h13" /><path d="M8 19h13" /></svg> Aperçu</button>
                    <button class="view-switch-btn" data-view="table" onclick="setSeriesViewMode('table')" title="Vue tableau"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v18" /><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /><path d="M3 15h18" /></svg> Tableau</button>
                </div>
                <div class="toolbar-dropdown" id="table-columns-section" style="display: none;">
                    <button class="toolbar-btn toolbar-btn-icon-only" id="table-columns-btn" onclick="toggleToolbarDropdown('table-columns-menu', this)" title="Colonnes du tableau">
                        <span class="toolbar-btn-icon"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></span>
                    </button>
                    <div class="toolbar-dropdown-menu toolbar-dropdown-menu-right" id="table-columns-menu" style="display: none;"></div>
                </div>
                </div>
            </div>


            <!-- "la page /library/2 il n'y a pas de bouton pour selectionner les series" -
                 même pattern que volume-bulk-actions-bar (fiche série): repliée tant
                 qu'aucune série n'est cochée, voir updateSeriesBulkActionsBar/
                 toggleSeriesSelection côté library.js. -->
            <div id="series-bulk-actions-bar" class="series-bulk-bar" role="toolbar" aria-label="Actions sur les séries sélectionnées" style="display:none;"></div>

            <div class="series-grid poster-grid" id="series-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Chargement des données...</p>
                </div>
            </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal de matching manuel EBDZ -->
    <div class="modal" id="ebdz-match-modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-modal" onclick="closeEbdzMatchModal()">×</span>
            <div id="ebdz-match-modal-body"></div>
        </div>
    </div>

    <!-- Modal de matching manuel Komga -->
    <div class="modal" id="komga-match-modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-modal" onclick="closeKomgaMatchModal()">×</span>
            <div id="komga-match-modal-body"></div>
        </div>
    </div>

    <!-- "dans bibliotheque icone molette matcher bedetheque n'ouvre rien" - manquait ici
         (présente sur series-detail.html/verification.html) alors que le menu ⚙️ "Éditer"
         de la grille/affiches (series-edit-modal, library.js) propose bien "Matcher
         Bédéthèque" - openBedethequeMatchModal plantait silencieusement sur
         document.getElementById('bedetheque-match-modal') introuvable, sans rien afficher
         à l'utilisateur (exception non catchée dans le onclick). -->
    <div class="modal" id="bedetheque-match-modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-modal" onclick="closeBedethequeMatchModal()">×</span>
            <div id="bedetheque-match-modal-body"></div>
        </div>
    </div>

    <!-- Modal de recherche ED2K (voir searchMissingVolume/searchSeriesInSearchTab -
         toutes les recherches passent maintenant par cette modale, y compris depuis la
         grille/le tableau de la bibliothèque, pas seulement depuis la fiche série) -->
    <div class="modal" id="search-ed2k-modal">
        <div class="modal-content" style="max-width: 1300px;">
            <span class="close-modal" onclick="closeSearchModal()">×</span>
            <div id="search-modal-body"></div>
        </div>
    </div>

    <div class="modal cover-image-modal" id="cover-image-modal" role="dialog" aria-modal="true" aria-labelledby="cover-image-modal-caption">
        <div class="modal-content cover-image-modal-content">
            <button type="button" class="close-modal cover-image-modal-close" onclick="closeCoverModal()" aria-label="Fermer">×</button>
            <img id="cover-image-modal-image" class="cover-image-modal-image" alt="">
            <div id="cover-image-modal-caption" class="cover-image-modal-caption"></div>
        </div>
    </div>


   <script>
        const libraryId = {{ library_id }};
   </script>
    <script src="{{ url_for('static', filename='js/icons.js') }}?v={{ asset_version('js/icons.js') }}"></script>
    <script src="{{ url_for('static', filename='js/match-modal.js') }}?v={{ asset_version('js/match-modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search-results-table.js') }}?v={{ asset_version('js/search-results-table.js') }}"></script>
    <script src="{{ url_for('static', filename='js/history-shared.js') }}?v={{ asset_version('js/history-shared.js') }}"></script>
    <script src="{{ url_for('static', filename='js/library.js') }}?v={{ asset_version('js/library.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reader.js') }}?v={{ asset_version('js/reader.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nav.js') }}?v={{ asset_version('js/nav.js') }}"></script>
</body>
</html>
